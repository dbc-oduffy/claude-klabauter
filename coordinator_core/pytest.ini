[pytest]
# claude-klabauter-native test home — established by pcore-04 C0.
# rootdir/inifile resolution follows the test-path argument (pytest picks the config
# CLOSEST to the arg's common ancestor):
#   - `pytest coordinator_core/` (the pinned full/fast cmd) OR `pytest` run from inside
#     coordinator_core/ → THIS file is the active ini, rootdir = coordinator_core/.
#   - bare `pytest` from the project root (no path arg) → root pyproject.toml
#     [tool.pytest.ini_options] (testpaths = ["coordinator_core"]) is the active config.
# Every marker is registered in BOTH configs so it resolves under either invocation — the
# three tier markers below (`cadence`/`pending_fix`/`designed_red`) landed in pyproject.toml
# on 2026-07-22 and were missing here until 2026-07-28, so a path-arg run emitted
# PytestUnknownMarkWarning for each and would hard-fail under `--strict-markers`.
#
# Spec backlink: docs/plans/2026-07-04-pcore-04-advisory-hook-ops-claude-klabauter-engine.md § C0 / D3
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (deselect with -m 'not slow')
    real_home: opt out of conftest.py's home-directory quarantine (live-tree parity oracles only; read-only)
    allow_environ_leak: opt out of conftest.py's os.environ leak detector (tests that deliberately assert on process-wide env mutation ONLY)
    cadence: heavy suite, runs at cadence gates, not per-commit
    pending_fix: claude-klabauter subject, known-broken path assumption — excluded from tiers until fixed
    designed_red: red by design; failure output is a worklist; never gate on it
    spawns_process: test spawns a real OS process (git/bash/python/node); admitted by the spawn ratchet in coordinator_core/tests/test_no_new_spawning_tests.py
