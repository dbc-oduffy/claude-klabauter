# Ported from DoE-claude `state/audits/2026-07-20-stale-record-triage.md` (97 lines),
# "## Group C — auto-reconcile surfaced records" (the `gate_eval` and `commit_reality`
# sub-tables only). Purpose: coordinator_core/reconcile has no in-repo record of the
# per-record verdicts a 2026-07-20 read-only triage agent reached against the daily
# `handoff.reconcile_open` surfaced-record list, so AC7/AC10/AC11
# (docs/plans/2026-08-25-reconcile-open-comes-back-under-the-bar.md, claude-klabauter)
# could only be checked by re-reading a sibling repo mid-chunk. This fixture makes the
# false-positive rate measurable here instead.
#
# Carries BOTH polarities deliberately (per that chunk's own body text): true positives
# (`is_false_positive: false`) as well as false ones, so a detector fix that suppresses
# ALL output would fail an AC11-style check against `true_positive` rows, not silently
# pass by having nothing left to compare.
#
# Negative-spec: this file is a static port of one dated audit's human judgement calls,
# not a live query against either repo -- it does not update itself when DoE re-triages,
# and it is not itself a detector (see test_surfaced_false_positive_rate.py, which reads
# this file but never calls into gate_eval.py or commit_reality.py).
#
# KNOWN DISCREPANCY (leave for C6/C7/PM, not silently resolved here): the plan text
# (AC7/AC10) calls this "the audit's 25-row oracle" and states DoE measured "15 of 25"
# surfaced rows per day as false positives. The audit's own Group C tables, read literally
# and with the grouped rows (engine-migration x3, roadmap-sat-02..07 x6) expanded to one
# oracle row per underlying record, enumerate 24 records total, of which 11 carry
# explicit false-positive language ("DETECTOR BUG", "attribution spurious", a stale
# FLIP-TO-IMPLEMENTED verdict, or "NO ACTION -- read-model lag"). This file ports exactly
# those 24 records and tags exactly those 11 as false positives -- it does not fabricate a
# 25th record or re-tag a record to force the arithmetic to 25/15, since neither this
# audit document nor this chunk's brief specifies what a 25th record or a 4th untagged
# false positive would be.
