schema_version: 1
pipeline: nlm-preflight
description: Fixture NotebookLM preflight; halts the chain unless the notebook session is usable.
inputs:
  brief: required
  scratch_dir: optional
stages:
  - id: check
    phase: Preflight
    agent_type: general-purpose
    model: haiku
    template: nlm-preflight-template.md
    fan_out: none
    halts_unless: ready
    output: "{{scratch_dir}}/preflight.md"
    schema:
      type: object
      required: [ready, remedy]
      properties:
        ready: { type: boolean }
        remedy: { type: array, items: { type: string } }
