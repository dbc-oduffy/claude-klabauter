schema_version: 1
pipeline: web
description: Fixture web pipeline whose first stage is the scope stage that writes the brief every later stage reads.
inputs:
  brief: required
  scratch_dir: optional
stages:
  - id: scope
    phase: Scope
    agent_type: general-purpose
    model: sonnet
    template: web-scope-template.md
    fan_out: none
    produces_brief: true
    output: "{{scratch_dir}}/scope.md"
  - id: sweep
    phase: Sweep
    agent_type: general-purpose
    model: sonnet
    template: web-sweep-template.md
    fan_out: none
    depends_on: [scope]
    output: "{{scratch_dir}}/sweep.md"
