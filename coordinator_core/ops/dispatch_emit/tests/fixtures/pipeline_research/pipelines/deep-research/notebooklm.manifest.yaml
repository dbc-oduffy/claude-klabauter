schema_version: 1
pipeline: notebooklm
description: Fixture notebooklm pipeline carrying DoE's gated stage ids scope, scout, workers, sweep.
inputs:
  brief: required
  scratch_dir: optional
  lists:
    notebooks:
      kind: strings
stages:
  - id: scope
    phase: Scope
    agent_type: general-purpose
    model: sonnet
    template: notebooklm-ask-template.md
    produces_brief: true
    output: "{{scratch_dir}}/strategy.md"
  - id: scout
    phase: Scout
    agent_type: general-purpose
    model: haiku
    template: notebooklm-ask-template.md
    depends_on: [scope]
    optional: true
    output: "{{scratch_dir}}/sources.md"
  - id: workers
    phase: Workers
    agent_type: general-purpose
    model: sonnet
    template: notebooklm-ask-template.md
    fan_out:
      over: inputs.notebooks
    depends_on: [scout]
    output: "{{scratch_dir}}/{{item}}-summary.md"
  - id: sweep
    phase: Sweep
    agent_type: general-purpose
    model: sonnet
    template: notebooklm-ask-template.md
    depends_on: [workers]
    output: "{{scratch_dir}}/merged-claims.json"
