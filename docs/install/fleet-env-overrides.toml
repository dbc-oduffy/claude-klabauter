# Fleet-environment resolution overrides. An override is a resolution-time
# uv instrument (expands the acceptable version set, per uv's own docs) —
# NOT a fix. Every entry below REQUIRES `owner` and `expires`; a test fails
# if either is absent (AC3, docs/plans/2026-08-16-one-environment-for-the-fleet.md).
# An override without an owner and an expiry is a latent runtime failure
# wearing a green resolution (docs/reference/fleet-shared-environment-contract.md).
#
# Do NOT add a `huggingface_hub` override here — the PM ruling raising that
# floor belongs in `fleet-env-requirements.in` as a first-class floor
# (coordinator_core/install/fleet_env_lock.py's `_FIRST_CLASS_FLOORS`), not
# as override scaffolding.
#
# NEVER override `Pillow` downward. Its `>=12.2.0,<13.0` floor in
# fleet-env-requirements.in is a SECURITY floor, not a preference: the PSD
# integer-overflow out-of-bounds-write class (CVE-2026-25990, -40192, -42308,
# -42309, -42310, -42311). A prior `<12.0` bound actively blocked the fix.
# Reported by example-game-workbench-repo, 2026-08-16, via
# cross-repo/inbox/2026-08-16-example-game-repo-em-sidecar-dep-set-overlay-answer.md.
# An override lowering it would resolve green and reintroduce an RCE class.

